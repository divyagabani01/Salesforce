<template>
  <template if:true={combinedDetails}>
      <div class="id-card slds-box slds-theme_default slds-m-around_medium">
          <div class="slds-grid slds-wrap slds-grid_vertical-align-center">
              <!-- Left Section: Profile Image -->
              <div class="slds-col slds-size_4-of-12 slds-m-right_medium">
                  <div class="profile-image-container">
                      <img
                          class="profile-image"
                          src={combinedDetails.imageurl}
                          alt={combinedDetails.title}
                      />
                  </div>
              </div>

              <!-- Right Section: Account Details -->
              <div class="slds-col slds-size_8-of-12">
                  <div class="field">
                      <span class="field-label">Name:</span>
                      <span class="field-value">{combinedDetails.Name}</span>
                  </div>
                  <div class="field">
                      <span class="field-label">Phone:</span>
                      <span class="field-value">{combinedDetails.Phone}</span>
                  </div>
                  <div class="field">
                      <span class="field-label">Email:</span>
                      <span class="field-value">{combinedDetails.Account_Email__c}</span>
                  </div>
                  <div class="field">
                      <span class="field-label">Birth Date:</span>
                      <span class="field-value">{formattedBirthDate}</span>
                  </div>
                  <div class="field">
                      <span class="field-label">Active Status:</span>
                      <span class="field-value">{activeStatus}</span>
                  </div>
                  <div class="field">
                      <span class="field-label">Type:</span>
                      <span class="field-value">{combinedDetails.Type}</span>
                  </div>
                  <div class="field">
                      <span class="field-label">Billing Address:</span>
                      <span class="field-value">
                          {combinedDetails.BillingStreet}, 
                          {combinedDetails.BillingCity}, 
                          {combinedDetails.BillingState}, 
                          {combinedDetails.BillingPostalCode}, 
                          {combinedDetails.BillingCountry}
                      </span>
                  </div>
              </div>
          </div>
      </div>
  </template>

  <template if:true={error}>
      <div class="slds-text-heading_medium">Error: {error.body.message}</div>
  </template>
</template>
