<template>
    <div class="container">
        <h1 class="slds-align_absolute-center slds-p-around_small"><b>Create New Account</b></h1>
        <p class="slds-align_absolute-center slds-p-around_small">Fill in the details below to create a new account.</p>
        <div class=" slds-align_absolute-center">
        <div class="slds-p-bottom_large slds-p-left_large" style="width:500px">
            <lightning-input label="Name" value={field.Name} onchange={changeHandler} data-id="Name"></lightning-input>
            <lightning-input label="Phone" value={field.Phone} onchange={changeHandler} data-id="Phone"></lightning-input>
            <lightning-input type="email" label="Email" value={field.Email} onchange={changeHandler} data-id="Email"></lightning-input>
            <lightning-input type="toggle" label="Active" checked={field.IsActive} onchange={changeHandler} data-id="IsActive"></lightning-input>
            <lightning-input type="date" label="Birth Date" value={field.BirthDate} onchange={changeHandler} data-id="BirthDate"></lightning-input>
            <template if:true={birthDateError}>
                <div class="slds-text-color_error slds-m-top_x-small">{birthDateError}</div>
            </template>
            <lightning-select label="Type of Account" data-id="Type" value={field.Type} options={options.Type} onchange={changeHandler} required></lightning-select>
            <lightning-input label="Billing Street" value={field.BillingStreet} onchange={changeHandler} data-id="BillingStreet"></lightning-input>
            <lightning-input label="Billing City" value={field.BillingCity} onchange={changeHandler} data-id="BillingCity"></lightning-input>
            <lightning-input label="Billing State" value={field.BillingState} onchange={changeHandler} data-id="BillingState"></lightning-input>
            <lightning-input label="Billing Postal Code" value={field.BillingPostalCode} onchange={changeHandler} data-id="BillingPostalCode"></lightning-input>

            <!-- File Upload Section -->
            <div class="file-container">
                <div class="dropzone" onclick={triggerFileInput} ondragover={handleDragOver} ondragleave={handleDragLeave} ondrop={handleDrop}>
                    <div class="dropzone-content">
                        <lightning-icon icon-name="utility:upload" alternative-text="Upload" size="small"></lightning-icon>
                        <p class="dropzone-text">Drag & drop files here or click to upload</p>
                    </div>
                    <input type="file" multiple accept="image/*" onchange={handleFileSelect} hidden>
                </div>

                <div class="preview-container">
                    <template for:each={field.files} for:item="file">
                        <div class="preview-item" key={file.id}>
                            <img src={file.previewUrl} alt={file.name} class="preview-image" />
                            <lightning-icon class="remove-icon" icon-name="action:close" alternative-text="close" title="close" size="xx-small" data-id={file.id} onclick={handleRemoveFile}></lightning-icon>
                        </div>
                    </template>
                </div>
            </div>

            <lightning-button label="Submit" type="button" onclick={handleSubmit}></lightning-button>
        </div>
    </div>
    </div>
</template>
