<template>
    <div class="slds-size_1-of-4">
    <lightning-carousel>
        <template lwc:if={carouselArr}>
                <template for:each={carouselArr} for:item="carousel">
                    <lightning-carousel-image key={carousel.id} src={carousel.src} header={carousel.header} 
                        description={carousel.description} alternative-text={carousel.alternativeText} href={carousel.href}>
                    </lightning-carousel-image>
                </template>
            </template>
        </lightning-carousel>
    </div>
</template>
