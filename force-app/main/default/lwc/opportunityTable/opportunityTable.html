<template>
    <c-lightning-table tabledata={recordData} columns={columns} onupdatevalue={handleSearchData} onhandlerowaction={handleRowAction} loading={loading} ></c-lightning-table>

    <!-- Pagination Controls -->
    <div class="slds-grid slds-grid_vertical-align-center slds-p-top_small slds-p-horizontal_x-small slds-grid_align-spread">
        <div class="slds-col slds-align_absolute-left">
            <div class="slds-list_inline">
                <label class="text slds-text-color_weak slds-p-horizontal_xx-small" for="recordsPerPage">Page
                    Size:</label>
                <div class="slds-select_container">
                    <select class="slds-select" id="recordsPerPage" onchange={handleRecordsPerPage}>
                        <template for:each={pageSizeOptions} for:item="option">
                            <option key={option} value={option}>{option}</option>
                        </template>
                    </select>
                </div>
            </div>
        </div>
        <!-- PAGE NAVIGATION -->
        <div class="slds-col slds-align_absolute-center" style="height:3rem">
            <lightning-button label="First" icon-name="utility:jump_to_left" onclick={firstPage}
                disabled={bDisableFirst}></lightning-button>
            <lightning-button label="Previous" icon-name="utility:chevronleft" onclick={previousPage}
                disabled={bDisablePrev}></lightning-button>
            <span class="slds-badge">Showing {pageNumber} of {totalPages} Page(s)</span>
            <lightning-button label="Next" icon-name="utility:chevronright" onclick={nextPage}
                disabled={bDisableNext}></lightning-button>
            <lightning-button label="Last" icon-name="utility:jump_to_right" onclick={lastPage}
                disabled={bDisableLast}></lightning-button>
        </div>
        <!-- TOTAL RECORDS -->
        <div class="slds-col slds-clearfix">
            <div class="slds-float_left">
                <span class="slds-badge slds-p-horizontal_small">Total Records: {totalRecords}</span>
            </div>
        </div>
    </div>
    <template lwc:if={isModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">

                <!-- Modal/Popup Header -->
                <header class="slds-modal__header">
                    <div>
                        <div>
                            <button
                                class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse button"
                                title="Close" onclick={closeModal}>
                                <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"
                                    style="color: #ff0000;"
                                    class="slds-button__icon slds-icon-text-success"></lightning-icon>
                                <span class="slds-assistive-text">Close</span>
                            </button>
                        </div>
                        <div>
                            <h2 class="slds-text-heading_medium">{ModalTitleLabel} Account</h2>
                        </div>
                    </div>
                </header>

                <!-- Modal/Popup Body -->
                <div class="slds-modal__content slds-p-around_medium">
                    <template lwc:if={isEdit}>
                        <!-- <lightning-input type="text" label="Name" name="Name" value={field.Name}
                        onchange={handleInputChange}>
                    </lightning-input>
                    <lightning-input type="text" label="Id" name="Id" value={field.Id}
                        onchange={handleInputChange} read-only="true">
                    </lightning-input>

                    <lightning-input type="text" label="Type" name="Type" value={field.Type}
                        onchange={handleInputChange}>
                    </lightning-input>

                    <lightning-input type="text" label="Phone" name="Phone" value={field.Phone}
                        onchange={handleInputChange}>
                    </lightning-input>

                    <lightning-input type="text" label="Website" name="Website" value={field.Website}
                        onchange={handleInputChange}>
                    </lightning-input>

                    <lightning-select name="Active" label="Active" value={field.Active} options={options}
                        onchange={handleInputChange} ></lightning-select> -->
                        <lightning-record-edit-form record-id={recordId} object-api-name="Opportunity">
                            <lightning-messages> </lightning-messages>
                            <lightning-output-field field-name="Id">
                            </lightning-output-field>
                            <lightning-input-field field-name="Name" value={field.Name}
                                onchange={handleInputChange}> </lightning-input-field>
                            <lightning-input-field field-name="Amount" value={field.Amount}
                                onchange={handleInputChange}> </lightning-input-field>
                            <lightning-input-field field-name="CloseDate" value={field.CloseDate}
                                onchange={handleInputChange}> </lightning-input-field>
                            <lightning-input-field field-name="Probability" value={field.Probability}
                                onchange={handleInputChange}> </lightning-input-field>
                            <lightning-input-field field-name="StageName" value={field.StageName}
                                onchange={handleInputChange}> </lightning-input-field>
                        </lightning-record-edit-form>
                    </template>
                    <template lwc:if={isView}>
                        <template lwc:if={isView}>
                            <template lwc:if={isLoading}>
                                <div class="exampleHolder" style="height: 200px;">
                                    <lightning-spinner alternative-text="Loading"
                                        size="medium"></lightning-spinner>
                                </div>
                            </template>
                            <template lwc:elseif={recordId}>
                                <lightning-input type="text" read-only="true" label="Name" name="Name"
                                    value={field.Name}></lightning-input>
                                <lightning-input type="text" read-only="true" label="Amount" name="Amount"
                                    value={field.Amount}></lightning-input>
                                <lightning-input type="text" read-only="true" label="CloseDate" name="CloseDate"
                                    value={field.CloseDate}></lightning-input>
                                <lightning-input type="text" read-only="true" label="Probability" name="Probability"
                                    value={field.Probability}></lightning-input>
                                <lightning-input type="text" read-only="true" label="StageName" name="StageName"
                                    value={field.StageName}></lightning-input>
                            </template>
                        </template>

                    </template>
                    <template lwc:if={isDelete}>
                        Are you sure you want to delete this Opportunity?
                    </template>

                </div>

                <!-- Modal/Popup Footer -->
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" class="slds-m-horizontal_x-small"
                        onclick={closeModal}></lightning-button>
                    <template lwc:if={isActive}>
                        <lightning-button label="Deactivate" variant="destructive-text"
                            class="slds-m-horizontal_x-small" onclick={deactiveAccount}></lightning-button>
                    </template>
                    <template lwc:if={isButtonVisible}>
                        <lightning-button variant="brand" label={ModalButtonLabel} data-id={ModalTitleLabel}
                        onclick={saveChanges}></lightning-button>
                    </template>
                </footer>
            </div>
        </section>

        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
