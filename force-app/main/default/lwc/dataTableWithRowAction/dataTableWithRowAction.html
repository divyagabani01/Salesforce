<template>
    <div class="container" style="height: 500px;">
        <div class="slds-p-left_large" style="width:500px">
            <lightning-input type="search" label="Search Account Name" name="Name" value={searchValue}
                onchange={handleSearch}></lightning-input>
            <!-- <lightning-icon icon-name="utility:close" alternative-text="Connected" size="xx-small"
            title="xx-small size" class="close-icon" onclick={clearSearch}></lightning-icon> -->
        </div>
        <div class="slds-p-around_x-small" style="height:300px;">
            <div class="slds-p-top_large slds-p-horizontal_x-small" style="height:320px; width:100%;">
                <lightning-datatable key-field="id" data={recordData} columns={columns} onrowaction={handleRowAction}>
                </lightning-datatable>
                <template if:false={hasData}>
                    <template if:false={loading}>
                        <p>No data found</p>
                    </template>
                    <template if:true={loading}>
                        <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                    </template>
                </template>
            </div>
            
            <div class="slds-m-top_medium">
                <div class="slds-grid slds-grid_vertical-align-center slds-p-horizontal_x-small slds-grid_align-spread ">
                    <!--RECORDS PER PAGE-->
                    <div class="slds-col slds-align_absolute-left">
                        <div class="slds-list_inline">
                            <label class="text slds-text-color_weak slds-p-horizontal_xx-small" for="recordsPerPage">Page
                                Size: </label>
                            <!-- <div class="slds-select_container">
                            <select class="slds-select" id="recordsPerPage"    onchange={handleRecordsPerPage}>
                                 Dynamic Options 
                                <template for:each={pageSizeOptions} for:item="option">
                                    <option key={option} value={option} disabled={disableNumber}>{option}</option>
                                </template>
                            </select>
                        </div> -->
                            <div class="slds-select_container">
                                <select class="slds-select" id="recordsPerPage" onchange={handleRecordsPerPage}>
                                    <!-- Dynamic Options -->
                                    <template for:each={pageSizeOptions} for:item="option">
                                        <option key={option} value={option} disabled={disableNumber}>{option}</option>
                                    </template>
                                </select>
                            </div>
    
                        </div>
                    </div>
                    <!--PAGE NAVIGATION-->
                    <div class="slds-col slds-align_absolute-center" style="height:3rem">
                        <lightning-button disabled={bDisableFirst} icon-name="utility:jump_to_left" label=""
                            class="slds-p-horizontal_xx-small" alternative-text="first page"
                            onclick={firstPage}></lightning-button>
                        <lightning-button disabled={bDisableFirst} icon-name="utility:chevronleft" label=""
                            alternative-text="Previous" onclick={previousPage}></lightning-button>
                        &nbsp;
                        <span class="slds-badge">Showing {pageNumber} &nbsp;of&nbsp; {totalPages} &nbsp;&nbsp;Page(s)</span>
                        &nbsp;
                        <lightning-button disabled={bDisableLast} icon-name="utility:chevronright" label=""
                            alternative-text="Next" onclick={nextPage} class="slds-p-horizontal_xx-small"
                            icon-position="right"></lightning-button>
                        <lightning-button disabled={bDisableLast} icon-name="utility:jump_to_right" label=""
                            alternative-text="last page" onclick={lastPage} icon-position="right"></lightning-button>
                    </div>
                    <!--TOTAL RECORDS-->
                    <div class="slds-col slds-clearfix">
                        <div class="slds-float_left ">
                            <span class="slds-badge slds-p-horizontal_small"> Total Records: {totalRecords}</span>
                        </div>
                    </div>
                </div>
            </div>
            <template lwc:if={isModalOpen}>
                <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                    <div class="slds-modal__container">

                        <!-- Modal/Popup Header -->
                        <header class="slds-modal__header">
                            <div>
                                <div>
                                    <button
                                        class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse button"
                                        title="Close" onclick={closeModal}>
                                        <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"
                                            style="color: #ff0000;"
                                            class="slds-button__icon slds-icon-text-success"></lightning-icon>
                                        <span class="slds-assistive-text">Close</span>
                                    </button>
                                </div>
                                <div>
                                    <h2 class="slds-text-heading_medium">{ModalTitleLabel} Account</h2>
                                </div>
                            </div>
                        </header>

                        <!-- Modal/Popup Body -->
                        <div class="slds-modal__content slds-p-around_medium">
                            <template lwc:if={isEdit}>
                                <!-- <lightning-input type="text" label="Name" name="Name" value={field.Name}
                                onchange={handleInputChange}>
                            </lightning-input>
                            <lightning-input type="text" label="Id" name="Id" value={field.Id}
                                onchange={handleInputChange} read-only="true">
                            </lightning-input>

                            <lightning-input type="text" label="Type" name="Type" value={field.Type}
                                onchange={handleInputChange}>
                            </lightning-input>

                            <lightning-input type="text" label="Phone" name="Phone" value={field.Phone}
                                onchange={handleInputChange}>
                            </lightning-input>

                            <lightning-input type="text" label="Website" name="Website" value={field.Website}
                                onchange={handleInputChange}>
                            </lightning-input>

                            <lightning-select name="Active" label="Active" value={field.Active} options={options}
                                onchange={handleInputChange} ></lightning-select> -->
                                <lightning-record-edit-form record-id={recordId} object-api-name="Account">
                                    <lightning-messages> </lightning-messages>
                                    <lightning-output-field field-name="AccountId">
                                    </lightning-output-field>
                                    <lightning-input-field field-name="Name" value={field.Name}
                                        onchange={handleInputChange}> </lightning-input-field>
                                    <lightning-input-field field-name="Phone" value={field.Phone}
                                        onchange={handleInputChange}> </lightning-input-field>
                                    <lightning-input-field field-name="Website" value={field.Website}
                                        onchange={handleInputChange}> </lightning-input-field>
                                    <lightning-input-field field-name="Type" value={field.Type}
                                        onchange={handleInputChange}> </lightning-input-field>
                                    <lightning-input-field field-name="Active__c" value={field.Active__c}
                                        disabled="true" onchange={handleInputChange}> </lightning-input-field>
                                </lightning-record-edit-form>
                            </template>
                            <template lwc:if={isView}>
                                <template lwc:if={isView}>
                                    <template lwc:if={isLoading}>
                                        <div class="exampleHolder" style="height: 200px;">
                                            <lightning-spinner alternative-text="Loading"
                                                size="medium"></lightning-spinner>
                                        </div>
                                    </template>
                                    <template lwc:elseif={recordId}>
                                        <lightning-input type="text" read-only="true" label="Name" name="Name"
                                            value={field.Name}></lightning-input>
                                        <lightning-input type="text" read-only="true" label="Phone" name="Phone"
                                            value={field.Phone}></lightning-input>
                                        <lightning-input type="text" read-only="true" label="Website" name="Website"
                                            value={field.Website}></lightning-input>
                                        <lightning-input type="text" read-only="true" label="Type" name="Type"
                                            value={field.Type}></lightning-input>
                                        <lightning-input type="text" read-only="true" label="Active" name="Active__c"
                                            value={field.Active__c}></lightning-input>
                                    </template>
                                </template>


                            </template>
                            <template lwc:if={isDelete}>
                                Are you sure you want to delete this account?
                            </template>
                            <template lwc:if={isActive}>
                                Are you sure you want to Active this account?
                            </template>

                        </div>

                        <!-- Modal/Popup Footer -->
                        <footer class="slds-modal__footer">
                            <lightning-button label="Cancel" class="slds-m-horizontal_x-small"
                                onclick={closeModal}></lightning-button>
                            <template lwc:if={isActive}>
                                <lightning-button label="Deactivate" variant="destructive-text"
                                    class="slds-m-horizontal_x-small" onclick={deactiveAccount}></lightning-button>
                            </template>
                            <lightning-button variant="brand" label={ModalButtonLabel} data-id={ModalTitleLabel}
                                onclick={saveChanges}></lightning-button>
                        </footer>
                    </div>
                </section>

                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>
        </div>
    </div>
</template>
